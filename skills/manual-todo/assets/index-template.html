<!DOCTYPE html>
<html lang="ja">
<!-- where: ~/.claude/skills/manual-todo/assets/index-template.html（todo-hub reindex が ~/dev/todo/index.html を生成する元）
     what : 手作業 TODO ハブの一覧。未着手 / 進行中 / 完了 の 3 列カンバンボード（kargulstudio/kanban 風）
     why  : 進捗の段階ごとに分けて「次に手を付けるリスト」を一目で選べるようにするため -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手作業 TODO ハブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* 配色・影は kanban の globals.css に合わせる */
  :root {
    --bg: #ffffff; --panel: #ffffff; --panel-2: #fafafa;
    --border: #ededed; --card-border: #e7e7e9;
    --text: #121212; --text-dim: #757575; --text-mute: #a1a1a1;
    --accent: #0d5fea; --accent-dim: #e7effd;
    --success: #47ba39; --neutral: #a1a1a1;
    --shadow: 0 2px 4px 0 rgb(35 35 35 / .03), 0 1px 2px 0 rgb(35 35 35 / .04), 0 0 0 3px rgb(205 205 205 / .12);
    --shadow-hover: 0 2px 4px 0 rgb(35 35 35 / .04), 0 1px 2px 0 rgb(35 35 35 / .05), 0 4px 12px 0 rgb(35 35 35 / .06), 0 0 0 3px rgb(205 205 205 / .18);
    --shadow-control: 0 1px 2px 0 rgb(0 0 0 / .08), 0 0 0 1px #ededed;
    --shadow-lift: 0 0 0 1px rgb(37 117 255 / .24), 0 0 0 4px rgb(37 117 255 / .16), 0 2px 12px 0 rgb(35 35 35 / .08);
    --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: var(--font-sans); font-size: 14px; line-height: 1.5; letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* ヘッダー（上段: タイトルとサーバ状態 / 下段: TODO・日報のタブ。reports.html と同じ構成） */
  .hub-head { padding: 16px 24px 0; border-bottom: 1px solid var(--border); }
  .hub-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .hub-head h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
  .hub-head .subtitle { margin: 2px 0 0; color: var(--text-dim); font-size: 12px; }
  .hub-actions { display: flex; align-items: center; gap: 8px; }
  .hub-tabs { display: flex; gap: 20px; margin-top: 12px; }
  .tab {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 0 10px; margin-bottom: -1px;
    color: var(--text-dim); font-weight: 500; text-decoration: none; border-bottom: 2px solid transparent;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-current="page"] { color: var(--text); border-bottom-color: var(--text); }
  .tab-count { color: var(--text-mute); font-size: 12px; }
  .control {
    display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
    background: var(--panel); color: var(--text-dim); border-radius: 8px; box-shadow: var(--shadow-control);
    font-size: 12px; font-weight: 500; text-decoration: none; white-space: nowrap;
  }
  a.control:hover { background: var(--panel-2); color: var(--text); }
  .server-status i { width: 6px; height: 6px; border-radius: 50%; background: var(--neutral); }
  .server-status.on { color: var(--text); }
  .server-status.on i { background: var(--success); }

  .wrap { padding: 0 24px 24px; }

  /* ボード */
  .cards-grid { display: flex; align-items: flex-start; margin: 0 -24px; padding: 0 8px; }
  .col { flex: 1 1 0; min-width: 300px; padding: 0 16px 16px; border-right: 1px solid var(--border); align-self: stretch; }
  .col:last-child { border-right: none; }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 16px 0 20px; }
  .col-head h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.02em; }
  .col-count { color: var(--text-mute); font-size: 13px; }
  .col-cards { display: flex; flex-direction: column; gap: 14px; }
  .col-empty {
    display: flex; align-items: center; justify-content: center; height: 120px; margin: 0;
    border: 1px dashed var(--border); border-radius: 16px; background: var(--panel-2); color: var(--text-mute);
  }
  .col-empty[hidden] { display: none; }

  /* kanban の StatusBadge: 色付きの小さな角丸四角に白いアイコン */
  .badge {
    position: relative; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 14px; height: 14px; border-radius: 4px; color: #fff;
    box-shadow: 0 1px 2px 0 rgb(9 9 11 / .08), inset 0 1px 20px 0 rgb(255 255 255 / .16);
  }
  .badge svg { width: 8px; height: 8px; }
  .tone-todo { background: var(--neutral); }
  .tone-doing { background: var(--accent); }
  .tone-done { background: var(--success); }

  /* カード */
  .card {
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--panel); color: inherit; text-decoration: none;
    border-radius: 16px; box-shadow: var(--shadow);
    transition: box-shadow .15s ease;
  }
  .card:hover { box-shadow: var(--shadow-hover); }
  .card:focus-visible { outline: none; box-shadow: var(--shadow-lift); }
  /* カバー画像（プロジェクトの assets/hero.png）。完了列では出さず、代わりに右下のアバターで示す */
  .card-cover {
    display: flex; align-items: center; justify-content: center; height: 96px; flex-shrink: 0;
    background: var(--panel-2); border-bottom: 1px solid var(--card-border);
    color: var(--text-mute); font-size: 24px; font-weight: 600; letter-spacing: -0.02em;
  }
  .card-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card[data-status="done"] .card-cover { display: none; }
  .card:not([data-status="done"]) .avatar { display: none; }
  .card-main { display: flex; flex-direction: column; gap: 8px; padding: 16px; }
  .card-head { display: flex; align-items: flex-start; gap: 6px; }
  .card-icon { width: 14px; height: 14px; margin-top: 3px; flex-shrink: 0; color: var(--neutral); }
  .card[data-status="doing"] .card-icon { color: var(--accent); }
  .card[data-status="done"] .card-icon { color: var(--success); }
  .card-title {
    margin: 0; min-width: 0; flex: 1; font-size: 14px; font-weight: 600; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere;
  }
  .card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 0; color: var(--text-mute); font-size: 12px; }
  .dot-sep { width: 3px; height: 3px; border-radius: 50%; background: #d9d9d9; }
  .legacy-tag { padding: 1px 6px; border-radius: 6px; box-shadow: var(--shadow-control); font-size: 11px; }
  .card-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 16px; border-top: 1px solid var(--card-border);
  }
  .card-progress { display: inline-flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 12px; }
  .card-bar { width: 56px; height: 4px; border-radius: 999px; background: #f0f0f0; overflow: hidden; }
  .card-bar-fill { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .3s ease; }
  .card-done-label { display: none; color: var(--success); font-size: 12px; }
  .card[data-status="done"] .card-progress { display: none; }
  .card[data-status="done"] .card-done-label { display: inline; }
  .card[data-status="done"] .card-title { color: var(--text-dim); }
  .avatar {
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 20px; height: 20px; border-radius: 50%; overflow: hidden;
    background: var(--panel-2); box-shadow: var(--shadow-control);
    color: var(--text-dim); font-size: 10px; font-weight: 600;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  footer { padding: 8px 24px 40px; color: var(--text-mute); font-size: 12px; text-align: center; }
  footer code { font-family: var(--font-mono); }

  /* 狭い画面では列を横スクロール（kanban と同じく 85vw の列をスナップ） */
  @media (max-width: 900px) {
    .hub-head { padding: 14px 16px 0; }
    .wrap { padding: 0 16px 16px; }
    .cards-grid { margin: 0 -16px; padding: 0; overflow-x: auto; scroll-snap-type: x mandatory; }
    .col { flex: none; width: 85vw; max-width: 340px; min-width: 0; scroll-snap-align: start; }
    footer { padding: 8px 16px 32px; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-todo" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <path d="M5.5 4h8M5.5 8h8M5.5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01"/>
  </symbol>
  <symbol id="i-doing" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
    <circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="i-done" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 8.5l3.2 3.2L13 4.5"/>
  </symbol>
</svg>

<header class="hub-head">
  <div class="hub-top">
    <div>
      <h1>手作業 TODO ハブ</h1>
      <p class="subtitle">全プロジェクトの手作業タスクを進み具合ごとに並べる。カードを開くと各リストへ。</p>
    </div>
    <div class="hub-actions">
      <span class="control server-status" id="server-status"><i></i><span>サーバ確認中…</span></span>
    </div>
  </div>
  __NAV__
</header>

<div class="wrap">
<main class="cards-grid" id="cards">
  <section class="col" data-col="todo" aria-label="未着手">
    <div class="col-head"><span class="badge tone-todo"><svg><use href="#i-todo"></use></svg></span><h2>未着手</h2><span class="col-count mono">__COUNT_TODO__</span></div>
    <div class="col-cards">
__COL_TODO__
    </div>
    <p class="col-empty" __EMPTY_TODO__>ここにはまだありません</p>
  </section>
  <section class="col" data-col="doing" aria-label="進行中">
    <div class="col-head"><span class="badge tone-doing"><svg><use href="#i-doing"></use></svg></span><h2>進行中</h2><span class="col-count mono">__COUNT_DOING__</span></div>
    <div class="col-cards">
__COL_DOING__
    </div>
    <p class="col-empty" __EMPTY_DOING__>ここにはまだありません</p>
  </section>
  <section class="col" data-col="done" aria-label="完了">
    <div class="col-head"><span class="badge tone-done"><svg><use href="#i-done"></use></svg></span><h2>完了</h2><span class="col-count mono">__COUNT_DONE__</span></div>
    <div class="col-cards">
__COL_DONE__
    </div>
    <p class="col-empty" __EMPTY_DONE__>ここにはまだありません</p>
  </section>
</main>
</div>

<footer>生成: __GENERATED__ ／ 更新は <code>todo-hub reindex</code></footer>

<script>
(function() {
  // サーバが生きていれば進捗をライブ更新し、状態が変わったカードを該当する列へ移す
  var API = "http://localhost:7799";
  var statusEl = document.getElementById("server-status");
  var statusText = statusEl.querySelector("span");

  // todo-hub.py の card_status() と同じ判定
  function statusOf(done, total) {
    if (total > 0 && done === total) return "done";
    return done > 0 ? "doing" : "todo";
  }

  function column(key) {
    return document.querySelector('.col[data-col="' + key + '"]');
  }

  function refreshColumns() {
    ["todo", "doing", "done"].forEach(function(key) {
      var col = column(key);
      var n = col.querySelectorAll(".card").length;
      col.querySelector(".col-count").textContent = n;
      col.querySelector(".col-empty").hidden = n > 0;
    });
    // タブの件数は「未着手＋進行中」（todo-hub.py の render_nav と同じ数え方）
    var tabCount = document.querySelector('.tab[href="index.html"] .tab-count');
    if (tabCount) tabCount.textContent =
      document.querySelectorAll('.col[data-col="todo"] .card, .col[data-col="doing"] .card').length;
  }

  fetch(API + "/api/summary", { mode: "cors" }).then(function(r) { return r.json(); })
    .then(function(data) {
      statusText.textContent = "サーバ稼働中";
      statusEl.classList.add("on");
      (data.pages || []).forEach(function(p) {
        var card = document.querySelector('.card[data-slug="' + p.slug + '"]');
        if (!card) return;
        var pct = p.total ? Math.round(p.done / p.total * 100) : 0;
        var fill = card.querySelector(".card-bar-fill");
        if (fill) fill.style.width = pct + "%";
        var count = card.querySelector(".card-count");
        if (count) count.textContent = p.done + "/" + p.total;
        var st = statusOf(p.done, p.total);
        if (st === card.getAttribute("data-status")) return;
        card.setAttribute("data-status", st);
        card.querySelector(".card-icon use").setAttribute("href", "#i-" + st);
        var list = column(st).querySelector(".col-cards");
        // 完了したものは完了列の先頭へ（直近で終わったものが上に来る）
        if (st === "done") list.insertBefore(card, list.firstChild);
        else list.appendChild(card);
      });
      refreshColumns();
    })
    .catch(function() {
      statusText.textContent = "サーバ停止中（表示は生成時点の値）";
    });
})();
</script>

</body>
</html>
